services:
  relay:
    build: .
    image: agent-relay:2.0.0
    ports:
      - "8787:8787"
    environment:
      RELAY_PORT: "8787"
      RELAY_DB: /data/relay.db
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  relay-data:
